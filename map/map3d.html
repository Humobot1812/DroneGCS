<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DRONE_GCS Tactical 3D Map</title>
  <link rel="stylesheet" href="cesium/Widgets/widgets.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #090D14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      color: #E6EDF3;
      user-select: none;
      -webkit-user-select: none;
    }

    #cesiumContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #090D14;
    }

    /* ─── Sleek Tactical Coordinate HUD Bar ───────────────────────────────── */
    #coord-hud {
      position: absolute;
      bottom: 12px;
      left: 14px;
      z-index: 1000;
      background: rgba(9, 13, 20, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #1E283C;
      border-radius: 4px;
      padding: 6px 14px;
      color: #8B949E;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      pointer-events: none;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    #coord-hud span b {
      color: #00D4FF;
      font-weight: 600;
    }

    /* ─── Mode / Stale Telemetry Badge ───────────────────────────────────── */
    #status-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: rgba(9, 13, 20, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid #00D4FF;
      border-radius: 4px;
      padding: 4px 10px;
      color: #00D4FF;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(0, 212, 255, 0.2);
    }

    #status-badge.stale {
      border-color: #FFB300;
      color: #FFB300;
      box-shadow: 0 2px 10px rgba(255, 179, 0, 0.2);
    }

    /* ─── Cesium Widget Overrides & Dark Tactical Credit Container ────────── */
    .cesium-viewer {
      overflow: hidden;
    }

    .cesium-viewer-bottom {
      bottom: 10px !important;
      right: 14px !important;
      left: auto !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 10px !important;
      pointer-events: auto !important;
    }

    .cesium-widget-credits {
      background: rgba(9, 13, 20, 0.85) !important;
      border: 1px solid #1E283C !important;
      border-radius: 4px !important;
      padding: 3px 8px !important;
      color: #8B949E !important;
      font-size: 10px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
    }

    .cesium-widget-credits a {
      color: #8B949E !important;
      text-decoration: none !important;
    }

    .cesium-widget-credits a:hover {
      color: #00D4FF !important;
      text-decoration: underline !important;
    }

    .cesium-credit-textContainer,
    .cesium-credit-imageContainer {
      display: inline-block !important;
      vertical-align: middle !important;
    }
  </style>
  <script>
    window.CESIUM_BASE_URL = 'cesium/';
  </script>
  <script src="cesium/Cesium.js"></script>
  <script src="qwebchannel.js"></script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="status-badge">
    <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#00D4FF;"></span>
    <span id="badge-text">3D TACTICAL ENGINE ACTIVE</span>
  </div>

  <div id="coord-hud">
    <span>LAT: <b id="hud-lat">28.613939°</b></span>
    <span>LON: <b id="hud-lon">77.209021°</b></span>
    <span>ALT: <b id="hud-alt">0.0 m</b></span>
    <span>AGL: <b id="hud-agl">0.0 m</b></span>
    <span>HDG: <b id="hud-hdg">000°</b></span>
    <span>CAM: <b id="hud-cam">FOLLOW</b></span>
    <span>LAYER: <b id="hud-layer">Satellite</b></span>
  </div>

  <script src="map3d.js"></script>
</body>
</html>
